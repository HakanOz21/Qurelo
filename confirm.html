<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Mail bestätigen – Qurelo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0e0e0e;
        --surface: #1a1a1a;
        --black: #f0ede8;
        --accent: #1a4fff;
        --accent-light: rgba(26, 79, 255, 0.08);
        --border: rgba(255, 255, 255, 0.1);
        --muted: #666;
        --muted2: #999;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--black);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding: 1.25rem 2.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(14, 14, 14, 0.92);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
      }
      .logo {
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-decoration: none;
        color: #f0ede8;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 7rem 1.5rem 4rem;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 20px;
        padding: 2.5rem 2rem;
        opacity: 0;
        animation: fadeUp 0.5s ease 0.1s forwards;
        text-align: center;
      }
      .icon-wrap {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 1.75rem;
      }
      .icon-wrap.loading {
        background: rgba(26, 79, 255, 0.1);
        border: 1.5px solid rgba(26, 79, 255, 0.2);
        animation: spinFade 1.2s ease-in-out infinite;
      }
      .icon-wrap.success {
        background: rgba(26, 79, 255, 0.1);
        border: 1.5px solid rgba(26, 79, 255, 0.25);
      }
      .icon-wrap.error {
        background: rgba(239, 68, 68, 0.1);
        border: 1.5px solid rgba(239, 68, 68, 0.2);
      }
      @keyframes spinFade {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.95); }
      }
      h1 {
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--black);
        margin-bottom: 0.75rem;
      }
      .subtitle {
        font-size: 0.9rem;
        line-height: 1.65;
        color: var(--muted2);
        margin-bottom: 1.75rem;
      }
      .status-box {
        padding: 1rem 1.25rem;
        border-radius: 12px;
        font-size: 0.88rem;
        line-height: 1.55;
        margin-bottom: 1.5rem;
        text-align: left;
      }
      .status-box.info {
        background: rgba(26, 79, 255, 0.08);
        border: 1px solid rgba(26, 79, 255, 0.2);
        color: #7ba3ff;
      }
      .status-box.success {
        background: rgba(26, 79, 255, 0.1);
        border: 1px solid rgba(26, 79, 255, 0.25);
        color: #90b4ff;
      }
      .status-box.error {
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #f87171;
      }
      .cta-btn {
        display: inline-block;
        width: 100%;
        padding: 0.9rem 1.5rem;
        background: var(--accent);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s, transform 0.1s;
        text-align: center;
      }
      .cta-btn:hover { background: #0a3fef; }
      .cta-btn:active { transform: scale(0.97); }
      .cta-btn:disabled {
        background: #2a2a2a;
        color: var(--muted);
        cursor: not-allowed;
      }
      footer {
        padding: 1.5rem 2.5rem;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      footer p {
        font-size: 0.75rem;
        color: var(--muted);
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @media (max-width: 768px) {
        nav { padding: 1rem 1.25rem; }
        footer { flex-direction: column; gap: 0.5rem; text-align: center; }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/" class="logo">
        <span style="color:#1a4fff">Q</span><span style="color:#f0ede8">urelo</span>
      </a>
    </nav>

    <main>
      <div class="card" id="card">
        <div class="icon-wrap loading" id="icon">⟳</div>
        <h1 id="title">E-Mail wird bestätigt…</h1>
        <p class="subtitle" id="subtitle">Einen Moment bitte.</p>
        <div class="status-box info" id="status-box" style="display:none"></div>
        <button class="cta-btn" id="cta-btn" style="display:none" disabled>App öffnen</button>
      </div>
    </main>

    <footer>
      <div class="logo">
        <span style="color:#1a4fff">Q</span><span style="color:#f0ede8">urelo</span>
      </div>
      <p>© 2026 Qurelo. All rights reserved.</p>
    </footer>

    <script>
      const { createClient } = supabase;
      const client = createClient(
        "https://nqvzvqonjbnjalgishnw.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xdnp2cW9uamJuamFsZ2lzaG53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MjE4MzEsImV4cCI6MjA5NjM5NzgzMX0.rDrZ5yAo9qRUrjcLWcr8ot3NxduP8VQ4PTzum6LloGg"
      );

      const iconEl    = document.getElementById("icon");
      const titleEl   = document.getElementById("title");
      const subtitleEl = document.getElementById("subtitle");
      const statusBox = document.getElementById("status-box");
      const ctaBtn    = document.getElementById("cta-btn");

      function showSuccess() {
        iconEl.textContent = "✓";
        iconEl.className = "icon-wrap success";
        titleEl.textContent = "E-Mail bestätigt!";
        subtitleEl.textContent = "Dein Konto ist jetzt aktiv.";
        statusBox.className = "status-box success";
        statusBox.textContent = "Deine E-Mail wurde bestätigt. Du kannst jetzt die App öffnen und dich einloggen.";
        statusBox.style.display = "block";
        ctaBtn.textContent = "App öffnen";
        ctaBtn.removeAttribute("disabled");
        ctaBtn.style.display = "block";
        ctaBtn.onclick = () => {
          window.location.href = "qurelo://confirmed";
        };
      }

      function showError(msg) {
        iconEl.textContent = "✕";
        iconEl.className = "icon-wrap error";
        titleEl.textContent = "Bestätigung fehlgeschlagen";
        subtitleEl.textContent = "Der Link ist ungültig oder bereits abgelaufen.";
        statusBox.className = "status-box error";
        statusBox.textContent = msg || "Bitte fordere einen neuen Bestätigungslink in der App an.";
        statusBox.style.display = "block";
        ctaBtn.style.display = "none";
      }

      async function handleConfirmation() {
        // Supabase v2 puts tokens in the URL hash for email confirmation
        const hash = window.location.hash;

        // Check for PKCE / OTP code in query params (newer Supabase flow)
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const token_hash = params.get("token_hash");
        const type = params.get("type");

        try {
          if (code) {
            // PKCE flow
            const { error } = await client.auth.exchangeCodeForSession(code);
            if (error) throw error;
            showSuccess();
          } else if (token_hash && type) {
            // Email OTP flow
            const { error } = await client.auth.verifyOtp({ token_hash, type });
            if (error) throw error;
            showSuccess();
          } else if (hash && hash.includes("access_token")) {
            // Legacy implicit flow — Supabase JS automatically parses the hash on init
            const { data: { session }, error } = await client.auth.getSession();
            if (error) throw error;
            if (session) {
              showSuccess();
            } else {
              showError("Keine gültige Sitzung gefunden.");
            }
          } else {
            showError("Kein gültiger Bestätigungstoken in der URL gefunden.");
          }
        } catch (err) {
          showError(err.message || "Ein unbekannter Fehler ist aufgetreten.");
        }
      }

      // Small delay so the loading animation is visible
      setTimeout(handleConfirmation, 600);
    </script>
  </body>
</html>
