<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passwort zurücksetzen – Qurelo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0e0e0e;
        --surface: #1a1a1a;
        --black: #f0ede8;
        --accent: #1a4fff;
        --accent-light: rgba(26, 79, 255, 0.08);
        --border: rgba(255, 255, 255, 0.1);
        --muted: #666;
        --muted2: #999;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--black);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding: 1.25rem 2.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(14, 14, 14, 0.92);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
      }
      .logo {
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-decoration: none;
        color: #f0ede8;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 7rem 1.5rem 4rem;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 20px;
        padding: 2.5rem 2rem;
        opacity: 0;
        animation: fadeUp 0.5s ease 0.1s forwards;
      }
      .card-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: rgba(26, 79, 255, 0.1);
        border: 1.5px solid rgba(26, 79, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--black);
        margin-bottom: 0.5rem;
      }
      .subtitle {
        font-size: 0.9rem;
        line-height: 1.65;
        color: var(--muted2);
        margin-bottom: 1.75rem;
      }
      .field {
        margin-bottom: 0.75rem;
      }
      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--muted2);
        margin-bottom: 0.4rem;
        letter-spacing: 0.02em;
      }
      input[type="password"] {
        width: 100%;
        padding: 0.9rem 1.25rem;
        background: #111;
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        font-family: "Inter", sans-serif;
        font-size: 0.9rem;
        color: var(--black);
        outline: none;
        transition: border-color 0.2s;
      }
      input[type="password"]::placeholder { color: var(--muted); }
      input[type="password"]:focus { border-color: var(--accent); }
      input[type="password"].invalid { border-color: #ef4444; }
      .hint {
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 0.35rem;
      }
      .alert {
        padding: 0.85rem 1rem;
        border-radius: 10px;
        font-size: 0.85rem;
        line-height: 1.55;
        margin-bottom: 1rem;
      }
      .alert.error {
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #f87171;
      }
      .alert.success {
        background: rgba(26, 79, 255, 0.1);
        border: 1px solid rgba(26, 79, 255, 0.25);
        color: #90b4ff;
      }
      .submit-btn {
        width: 100%;
        padding: 0.9rem 1.5rem;
        background: var(--accent);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        margin-top: 0.5rem;
      }
      .submit-btn:hover { background: #0a3fef; }
      .submit-btn:active { transform: scale(0.97); }
      .submit-btn:disabled {
        background: #2a2a2a;
        color: var(--muted);
        cursor: not-allowed;
        transform: none;
      }
      .open-app-btn {
        display: block;
        width: 100%;
        padding: 0.9rem 1.5rem;
        background: var(--accent);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        transition: background 0.2s, transform 0.1s;
        margin-top: 0.75rem;
      }
      .open-app-btn:hover { background: #0a3fef; }
      .open-app-btn:active { transform: scale(0.97); }
      footer {
        padding: 1.5rem 2.5rem;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      footer p {
        font-size: 0.75rem;
        color: var(--muted);
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @media (max-width: 768px) {
        nav { padding: 1rem 1.25rem; }
        footer { flex-direction: column; gap: 0.5rem; text-align: center; }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/" class="logo">
        <span style="color:#1a4fff">Q</span><span style="color:#f0ede8">urelo</span>
      </a>
    </nav>

    <main>
      <div class="card">
        <div class="card-icon">🔑</div>
        <h1 id="title">Neues Passwort</h1>
        <p class="subtitle" id="subtitle">Wähle ein neues Passwort für dein Konto.</p>

        <div id="alert" class="alert" style="display:none"></div>

        <div id="form-wrap">
          <div class="field">
            <label for="password">Neues Passwort</label>
            <input type="password" id="password" placeholder="Mindestens 8 Zeichen" />
            <p class="hint">Mindestens 8 Zeichen</p>
          </div>
          <div class="field">
            <label for="confirm">Passwort bestätigen</label>
            <input type="password" id="confirm" placeholder="Passwort wiederholen" />
          </div>
          <button class="submit-btn" id="submit-btn" onclick="resetPassword()">
            Passwort speichern
          </button>
        </div>

        <a href="qurelo://login" class="open-app-btn" id="open-app-btn" style="display:none">
          App öffnen und einloggen
        </a>
      </div>
    </main>

    <footer>
      <div class="logo">
        <span style="color:#1a4fff">Q</span><span style="color:#f0ede8">urelo</span>
      </div>
      <p>© 2026 Qurelo. All rights reserved.</p>
    </footer>

    <script>
      const { createClient } = supabase;
      const client = createClient(
        "https://nqvzvqonjbnjalgishnw.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xdnp2cW9uamJuamFsZ2lzaG53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MjE4MzEsImV4cCI6MjA5NjM5NzgzMX0.rDrZ5yAo9qRUrjcLWcr8ot3NxduP8VQ4PTzum6LloGg"
      );

      const alertEl   = document.getElementById("alert");
      const formWrap  = document.getElementById("form-wrap");
      const submitBtn = document.getElementById("submit-btn");
      const openBtn   = document.getElementById("open-app-btn");
      const titleEl   = document.getElementById("title");
      const subtitleEl = document.getElementById("subtitle");

      function showAlert(type, msg) {
        alertEl.className = "alert " + type;
        alertEl.textContent = msg;
        alertEl.style.display = "block";
      }

      function hideAlert() {
        alertEl.style.display = "none";
      }

      // Check if we have a valid recovery session from the URL hash
      // Supabase JS v2 auto-parses the hash on init; we verify the session type
      async function checkRecoverySession() {
        const hash = window.location.hash;
        if (hash && hash.includes("type=recovery")) {
          // Session will be set automatically by Supabase client
          return;
        }
        // Check for PKCE code
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        if (code) {
          try {
            await client.auth.exchangeCodeForSession(code);
          } catch (e) {
            showAlert("error", "Ungültiger oder abgelaufener Reset-Link. Bitte fordere einen neuen an.");
            submitBtn.disabled = true;
          }
        }
      }

      checkRecoverySession();

      async function resetPassword() {
        hideAlert();
        const password = document.getElementById("password").value;
        const confirm  = document.getElementById("confirm").value;
        const pwInput  = document.getElementById("password");
        const cfInput  = document.getElementById("confirm");

        pwInput.classList.remove("invalid");
        cfInput.classList.remove("invalid");

        if (password.length < 8) {
          pwInput.classList.add("invalid");
          showAlert("error", "Das Passwort muss mindestens 8 Zeichen lang sein.");
          return;
        }

        if (password !== confirm) {
          cfInput.classList.add("invalid");
          showAlert("error", "Die Passwörter stimmen nicht überein.");
          return;
        }

        submitBtn.textContent = "Wird gespeichert…";
        submitBtn.disabled = true;

        const { error } = await client.auth.updateUser({ password });

        if (error) {
          submitBtn.textContent = "Passwort speichern";
          submitBtn.disabled = false;
          showAlert("error", error.message || "Ein Fehler ist aufgetreten. Bitte versuche es erneut.");
        } else {
          formWrap.style.display = "none";
          titleEl.textContent = "Passwort geändert!";
          subtitleEl.textContent = "Dein Passwort wurde erfolgreich aktualisiert.";
          showAlert("success", "Dein Passwort wurde geändert. Du kannst jetzt die App öffnen und dich einloggen.");
          openBtn.style.display = "block";
        }
      }
    </script>
  </body>
</html>
