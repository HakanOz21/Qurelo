<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passwort zurücksetzen – Qurelo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #000;
        color: #fff;
        font-family: -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .container {
        width: 100%;
        max-width: 400px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        color: #888;
        margin-bottom: 32px;
        line-height: 1.5;
      }
      input {
        width: 100%;
        background: #111;
        border: 1px solid #222;
        border-radius: 12px;
        padding: 16px;
        color: #fff;
        font-size: 16px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 12px;
        padding: 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
      }
      .error {
        color: #ff4444;
        margin-bottom: 12px;
        font-size: 14px;
      }
      .success {
        color: #44ff88;
        margin-bottom: 12px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Neues Passwort</h1>
      <p>Gib dein neues Passwort ein.</p>
      <div id="error" class="error" style="display: none"></div>
      <div id="success" class="success" style="display: none"></div>
      <input type="password" id="password" placeholder="Neues Passwort" />
      <button onclick="resetPassword()">Passwort speichern</button>
    </div>

    <script>
      const { createClient } = supabase;
      const client = createClient(
        "https://nqvzvqonjbnjalgishnw.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xdnp2cW9uamJuamFsZ2lzaG53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MjE4MzEsImV4cCI6MjA5NjM5NzgzMX0.rDrZ5yAo9qRUrjcLWcr8ot3NxduP8VQ4PTzum6LloGg",
      );

      async function resetPassword() {
        const password = document.getElementById("password").value;
        const errorEl = document.getElementById("error");
        const successEl = document.getElementById("success");

        errorEl.style.display = "none";
        successEl.style.display = "none";

        if (password.length < 6) {
          errorEl.textContent = "Passwort muss mindestens 6 Zeichen haben.";
          errorEl.style.display = "block";
          return;
        }

        const { error } = await client.auth.updateUser({ password });

        if (error) {
          errorEl.textContent = error.message;
          errorEl.style.display = "block";
        } else {
          successEl.textContent =
            "Passwort erfolgreich geändert! Du kannst diese Seite schließen.";
          successEl.style.display = "block";
        }
      }
    </script>
  </body>
</html>
